name: Android CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK Platform 37
        run: |
          cd "$ANDROID_HOME/platforms"
          curl -sL -o /tmp/platform-37.2.zip https://dl.google.com/android/repository/platform-37.2_r01.zip
          unzip -q /tmp/platform-37.2.zip -d /tmp/p37
          cp -r /tmp/p37/android-37.2 android-37
          sed -i 's/\${PLATFORM_VERSION}/17/g; s/^AndroidVersion.ApiLevel=.*/AndroidVersion.ApiLevel=37/' android-37/source.properties

      - name: Build release APK (unsigned)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Upload build log (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
